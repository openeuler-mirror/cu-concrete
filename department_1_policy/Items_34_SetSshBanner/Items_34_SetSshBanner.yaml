#部门编号
dep: 1
#加固项编号
id: 34
#目标配置文件
path: '/etc/ssh/sshd_config'
#加固配置项(迁移自 default_0_policy/Items_01_SshHarden, 对应 cuos-harden.conf 112)
#注: 本项所有配置项都不设还原值, 还原时统一删除该配置行, 回到 sshd 内置默认值
entries:
  #登录前打印警告横幅(还原时删除该行, 回到sshd内置默认值none, 即不显示横幅)
  - key: "Banner"
    value: "/etc/issue.net"
description: 'SSH登录横幅：登录前显示/etc/issue.net警告横幅'
