#部门编号
dep: 1
#加固项编号
id: 20
query:
    # net.ipv4.icmp_echo_ignore_all 配置行的匹配式(grep -E / sed BRE): 查找、判定、清理、还原共用
    # 等号两侧允许空格, 同时覆盖 "net.ipv4.icmp_echo_ignore_all=1" 与 "net.ipv4.icmp_echo_ignore_all = 1" 两种写法
    form: '^net\.ipv4\.icmp_echo_ignore_all[[:space:]]*='
    path: "/etc/sysctl.conf"
change:
    # 加固值: 在文件末尾另起一行写入
    value: 'net.ipv4.icmp_echo_ignore_all=1'
    # 还原值: 显式写回 0, 而不是删除配置行。
    # 原因: sysctl -p 只会把"文件中存在的键"写入内核, 文件里删掉某个键并不会让内核
    # 恢复默认值, 那样还原后内核里仍是 1(依然不能响应 ping), 配置与运行时会脱节。
    # 写成 0 后再 sysctl -p, 配置层与运行时层同时回到可响应 ping 的状态。
    recovery: 'net.ipv4.icmp_echo_ignore_all=0'

description: '禁止系统响应ping请求'
# 设置 net.ipv4.icmp_echo_ignore_all=1, 禁止系统响应 ping 请求
# 加固: 清理 /etc/sysctl.conf 中已有的 net.ipv4.icmp_echo_ignore_all 配置行, 然后在文件末尾另起一行写入 net.ipv4.icmp_echo_ignore_all=1
# 判定: 不存在生效配置行 -> 未加固; 存在时取值是 1 -> 已加固, 否则未加固
# 还原: 把 net.ipv4.icmp_echo_ignore_all 写回 0(配置项始终保留在配置文件中), 并 sysctl -p 让运行时立即生效
