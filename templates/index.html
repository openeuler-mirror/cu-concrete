<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CU-Concrete 安全加固平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667EEA 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
        }

        .card-title {
            font-size: 1.3rem;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #c9d0ef;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title .icon {
            width: 30px;
            height: 30px;
            background: linear-gradient(135deg, #667EEA 0%, #764ba2 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #c9d0ef;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-success:hover {
            box-shadow: 0 5px 20px rgba(17, 153, 142, 0.4);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .result-box {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.5;
        }

        .result-box pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-running {
            background: #fff3cd;
            color: #856404;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #e2e3e5;
            color: #383d41;
        }

        .task-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #c9d0ef;
        }

        .task-item:hover {
            background: #e9ecef;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .task-id {
            font-family: monospace;
            font-size: 12px;
            color: #666;
        }

        .task-time {
            font-size: 12px;
            color: #999;
        }

        .log-content {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.6;
            max-height: 300px;
            overflow: auto;
            white-space: pre-wrap;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #555;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 16px;
        }

        .pagination-info {
            color: #666;
            font-size: 14px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #c9d0ef;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .hidden {
            display: none;
        }

        .pool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .pool-card {
            background: linear-gradient(135deg, #667EEA 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .pool-card:hover {
            transform: scale(1.05);
        }

        .pool-card h4 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .pool-card p {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.3s;
        }

        .tab.active {
            color: #c9d0ef;
            border-bottom-color: #c9d0ef;
        }

        .tab:hover {
            color: #c9d0ef;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* 加固项复选框样式 */
        .harden-item {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            border: 1px solid #e0e0e0;
            transition: all 0.2s;
        }

        .harden-item:hover {
            background: #f0f0f0;
        }

        .harden-item.selected {
            background: #d4edda;
            border-color: #28a745;
        }

        .harden-item input[type="checkbox"] {
            width: auto;
            cursor: pointer;
        }

        .harden-item-info {
            flex: 1;
        }

        .harden-item-name {
            font-weight: 500;
            color: #333;
            font-size: 14px;
        }

        .harden-item-desc {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .harden-category {
            font-size: 11px;
            color: #c9d0ef;
            background: #f0f0ff;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 8px;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔒 CU-Concrete 安全加固平台</h1>
            <p>自动化安全策略执行与管理系统</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('pools')">☁️ 云池管理</div>
            <div class="tab" onclick="switchTab('tasks')">📋 任务管理</div>
            <div class="tab" onclick="switchTab('results')">📊 执行结果</div>
        </div>

        <!-- 云池管理 -->
        <div id="pools" class="tab-content active">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <div class="icon">☁️</div>
                        云池列表
                    </div>
                    <div id="poolList">
                        <div class="loading"></div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <div class="icon">▶️</div>
                        执行加固任务
                    </div>
                    <div class="form-group">
                        <label>选择云池</label>
                        <select id="executePoolId">
                            <option value="">请先获取云池列表</option>
                        </select>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="executePlaybook()">
                            ▶️ 执行加固
                        </button>
                        <button class="btn btn-secondary" onclick="loadPools()">
                            🔄 刷新列表
                        </button>
                    </div>
                    <div id="executeResult"></div>
                </div>
            </div>
        </div>

        <!-- 任务管理 -->
        <div id="tasks" class="tab-content">
            <div class="grid">
                <div class="card">
                    <div class="card-title">
                        <div class="icon">📋</div>
                        任务列表
                    </div>
                    <div class="btn-group" style="margin-bottom: 15px;">
                        <button class="btn btn-primary" onclick="loadTasks()">
                            🔄 刷新任务
                        </button>
                        <button class="btn btn-secondary" onclick="clearTasks()">
                            🗑️ 清空显示
                        </button>
                    </div>
                    <div id="taskList">
                        <p style="color: #999; text-align: center;">点击"刷新任务"加载任务列表</p>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">
                        <div class="icon">🔍</div>
                        任务详情与日志
                    </div>
                    <div class="form-group">
                        <label>任务ID</label>
                        <input type="text" id="taskIdInput" placeholder="输入任务ID">
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="getTaskDetail()">
                            📋 查看详情
                        </button>
                        <button class="btn btn-success" onclick="getTaskLogs()">
                            📄 查看日志
                        </button>
                    </div>
                    <div id="taskDetail"></div>
                </div>
            </div>
        </div>

        <!-- 执行结果 -->
        <div id="results" class="tab-content">
            <div class="card">
                <div class="card-title">
                    <div class="icon">📊</div>
                    查询执行结果
                </div>
                <div class="grid" style="margin-bottom: 20px;">
                    <div class="form-group">
                        <label>任务ID</label>
                        <input type="text" id="resultFile" placeholder="输入任务ID（如: 20240311-abc123）">
                    </div>
                    <div class="form-group">
                        <label>每页条数</label>
                        <input type="number" id="pageSize" value="10" min="1" max="100">
                    </div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="getResults()">
                        🔍 查询结果
                    </button>
                </div>
                <div id="resultsContainer"></div>
            </div>
        </div>

    <script>
        // API基础URL
        const API_BASE_URL = '';

        // 当前分页状态
        let currentPage = 1;
        let totalPages = 1;
        let currentResultFile = '';
        // 添加全局变量用于防抖
        let showMessageTimeout;

        // Playbook生成器状态

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // 显示消息
        function showMessage(containerId, message, type = 'info') {
            const container = document.getElementById(containerId);
            container.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        // 统一的API请求函数
        async function apiRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    ...options
                });

                // 修复5：处理非JSON响应
                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const text = await response.text();
                    console.error("非JSON响应:", text);
                    data = {
                        code: response.status,
                        message: `服务器返回错误: ${response.status} ${response.statusText}`,
                        rawResponse: text.substring(0, 200) + (text.length > 200 ? '...' : '')
                    };
                }

                return data;
            } catch (error) {
                console.error("网络请求失败:", error);
                return {
                    code: 500,
                    message: '请求失败: ' + error.message,
                    data: null
                };
            }
        }

        // 加载云池列表
        async function loadPools() {
            const container = document.getElementById('poolList');
            container.innerHTML = '<div class="loading"></div>';

            const data = await apiRequest(`${API_BASE_URL}/cu-concrete/pool-list/`);

            if (data.code === 200) {
                const pools = data.data.list;

                // 更新第一个tab的下拉框
                const poolSelect = document.getElementById('executePoolId');
                poolSelect.innerHTML = pools.map(pool =>
                    `<option value="${pool.id}">${pool.name} (${pool.id})</option>`
                ).join('');

                // 显示云池卡片
                container.innerHTML = `
                    <div class="pool-grid">
                        ${pools.map(pool => `
                            <div class="pool-card" onclick="selectPool('${pool.id}')">
                                <h4>${pool.name}</h4>
                                <p>ID: ${pool.id}</p>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                container.innerHTML = `<p style="color: red;">加载失败: ${data.message}</p>`;
            }
        }

        // 选择云池
        function selectPool(poolId) {
            document.getElementById('executePoolId').value = poolId;
            showMessage('executeResult', `已选择云池: ${poolId}`, 'info');
        }

        // 执行加固任务
        async function executePlaybook() {
            const poolId = document.getElementById('executePoolId').value;

            if (!poolId) {
                showMessage('executeResult', '请先选择云池', 'error');
                return;
            }

            const resultDiv = document.getElementById('executeResult');
            resultDiv.innerHTML = '<div class="loading"></div> 正在提交任务...';

            // 修改为 URL 查询参数方式
            const data = await apiRequest(`${API_BASE_URL}/cu-concrete/execute-playbook/?pool_id=${encodeURIComponent(poolId)}`, {
                method: 'POST'
            });

            if (data.code === 200) {
                showMessage('executeResult', `
                    <strong>任务已提交!</strong><br>
                    任务ID: ${data.data.task_id}
                `, 'success');
            } else {
                showMessage('executeResult', `提交失败: ${data.message}`, 'error');
            }
        }

        // 加载任务列表
        async function loadTasks() {
            const container = document.getElementById('taskList');
            container.innerHTML = '<div class="loading"></div> 正在加载...';

            const data = await apiRequest(`${API_BASE_URL}/cu-concrete/tasks/?current=1&pageSize=20`);

            if (data.code === 200) {
                const tasks = data.data.list;

                if (tasks.length === 0) {
                    container.innerHTML = '<p style="color: #999; text-align: center;">暂无任务</p>';
                    return;
                }

                container.innerHTML = tasks.map(task => {
                    let statusClass = 'status-pending';
                    if (task.status === 'running') statusClass = 'status-running';
                    else if (task.status === 'completed') statusClass = 'status-success';
                    else if (task.status === 'failed') statusClass = 'status-failed';

                    return `
                        <div class="task-item" onclick="document.getElementById('taskIdInput').value='${task.task_id}'">
                            <div class="task-header">
                                <span class="task-id">${task.task_id}</span>
                                <span class="status-badge ${statusClass}">${task.status}</span>
                            </div>
                            <div>云池: ${task.pool_name} (${task.pool_id})</div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = `<p style="color: red;">加载失败: ${data.message}</p>`;
            }
        }

        // 清空任务显示
        function clearTasks() {
            document.getElementById('taskList').innerHTML = '<p style="color: #999; text-align: center;">点击"刷新任务"加载任务列表</p>';
            document.getElementById('taskDetail').innerHTML = '';
        }

        // 获取任务详情
        async function getTaskDetail() {
            const taskId = document.getElementById('taskIdInput').value.trim();

            if (!taskId) {
                showMessage('taskDetail', '请输入任务ID', 'error');
                return;
            }

            const container = document.getElementById('taskDetail');
            container.innerHTML = '<div class="loading"></div> 正在查询...';

            // 修改为 URL 查询参数方式
            const data = await apiRequest(`${API_BASE_URL}/cu-concrete/task-detail/?task_id=${encodeURIComponent(taskId)}`);

            if (data.code === 200) {
                const task = data.data;
                let statusClass = 'status-pending';
                if (task.status === 'running') statusClass = 'status-running';
                else if (task.status === 'completed') statusClass = 'status-success';
                else if (task.status === 'failed') statusClass = 'status-failed';

                container.innerHTML = `
                    <div class="result-box">
                        <h4>任务信息</h4>
                        <p><strong>任务ID:</strong> ${task.task_id}</p>
                        <p><strong>云池:</strong> ${task.pool_name} (${task.pool_id})</p>
                        <p><strong>状态:</strong> <span class="status-badge ${statusClass}">${task.status}</span></p>
                        <p><strong>创建时间:</strong> ${task.created_at}</p>
                        ${task.result_file ? `<p><strong>结果文件:</strong> ${task.result_file}</p>` : ''}
                        ${task.error_message ? `<p style="color: red;"><strong>错误:</strong> ${task.error_message}</p>` : ''}
                    </div>
                `;
            } else {
                showMessage('taskDetail', `查询失败: ${data.message}`, 'error');
            }
        }

        // 获取任务日志
        async function getTaskLogs() {
            const taskId = document.getElementById('taskIdInput').value.trim();

            if (!taskId) {
                showMessage('taskDetail', '请输入任务ID', 'error');
                return;
            }

            const container = document.getElementById('taskDetail');
            container.innerHTML = '<div class="loading"></div> 正在加载日志...';

            // 修改为 URL 查询参数方式
            const data = await apiRequest(`${API_BASE_URL}/cu-concrete/task-logs/?task_id=${encodeURIComponent(taskId)}`);

            if (data.code === 200) {
                container.innerHTML = `
                    <h4 style="margin-bottom: 10px;">任务日志)</h4>
                    <div class="log-content">${data.data.content || '暂无日志'}</div>
                `;
            } else {
                showMessage('taskDetail', `加载日志失败: ${data.message}`, 'error');
            }
        }

        // 获取执行结果
        async function getResults(page = 1) {
            const taskId = document.getElementById('resultFile').value.trim();
            const pageSize = parseInt(document.getElementById('pageSize').value) || 10;

            if (!taskId) {
                showMessage('resultsContainer', '请输入任务ID', 'error');
                return;
            }

            currentResultFile = taskId;
            currentPage = page;

            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading"></div> 正在查询...';

            const data = await apiRequest(
                `${API_BASE_URL}/cu-concrete/get-results/?task_id=${encodeURIComponent(taskId)}&current=${page}&pageSize=${pageSize}`
            );

            if (data.code === 200) {
                const results = data.data;
                totalPages = Math.ceil(results.count / results.pageSize);

                if (results.list.length === 0) {
                    container.innerHTML = '<p style="color: #999; text-align: center;">暂无数据</p>';
                    return;
                }

                // 获取表头
                const headers = Object.keys(results.list[0]);

                container.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    ${headers.map(h => `<th>${h}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody>
                                ${results.list.map(row => `
                                    <tr>
                                        ${headers.map(h => {
                    let value = row[h] || '';
                    if (h === 'status') {
                        let statusClass = '';
                        if (value === '已加固') statusClass = 'status-success';
                        else if (value === '加固失败') statusClass = 'status-failed';
                        else if (value === '未加固') statusClass = 'status-pending';
                        if (statusClass) {
                            return `<td><span class="status-badge ${statusClass}">${value}</span></td>`;
                        }
                    }
                    return `<td>${value}</td>`;
                }).join('')}
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                    <div class="pagination">
                        <button class="btn btn-secondary" onclick="getResults(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
                            ← 上一页
                        </button>
                        <span class="pagination-info">
                            第 ${results.pageIndex} 页 / 共 ${totalPages} 页 (共 ${results.count} 条)
                        </span>
                        <button class="btn btn-secondary" onclick="getResults(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
                            下一页 →
                        </button>
                    </div>
                `;
            } else {
                showMessage('resultsContainer', `查询失败: ${data.message}`, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadPools();
        });

    </script>
</body>
</html>
